<li class="list-group-item course-preference" data-course-item>
    <input type="hidden" name="{{ widget.name }}" value="{{ course.pk }}">
    <span class="course-preference-name">
        {{ course.name }}
        {% if course.difficulty %}<span class="text-muted small">({{ course.difficulty }})</span>{% endif %}
    </span>
    <span class="form-check course-preference-exclude">
        <input class="form-check-input"
               type="checkbox"
               name="{{ widget.excluded_name }}"
               value="{{ course.pk }}"
               id="{{ widget.attrs.id }}_excluded_{{ course.pk }}"
               {% if excluded %}checked{% endif %}>
        <label class="form-check-label small"
               for="{{ widget.attrs.id }}_excluded_{{ course.pk }}">Not for me</label>
    </span>
</li>
